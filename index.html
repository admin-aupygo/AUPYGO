<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPYGO — Meet. Go out. Make friends.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="styles.css"/>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>
  <div class="header-inner">

    <div class="logo-aupygo" onclick="go('home')" title="AUPYGO">
      <span class="logo-a">A</span>
      <span class="logo-u">U</span>
      <span class="logo-p">P</span>
      <span class="logo-y">Y</span>
      <span class="logo-g">G</span>
      <span class="logo-o">O</span>
      <div class="location-pin"></div>
    </div>

    <!-- ICÔNES UNIQUEMENT -->

    <nav>

      <button onclick="go('home')" class="active" data-nav="home" data-i18n-title="nav.home" data-i18n-aria="nav.home" title="Accueil" aria-label="Accueil">
        <span class="icon">🏠</span>
      </button>

      <button onclick="go('map')" data-nav="map" data-i18n-title="nav.map" data-i18n-aria="nav.map" title="Carte" aria-label="Carte">
        <span class="icon">🗺️</span>
      </button>

      <button onclick="go('events')" data-nav="events" data-i18n-title="nav.events" data-i18n-aria="nav.events" title="Sorties" aria-label="Sorties">
        <span class="icon">🎉</span>
      </button>

      <button onclick="go('reconnect')" data-nav="reconnect" data-i18n-title="nav.reconnect" data-i18n-aria="nav.reconnect" title="Se retrouver" aria-label="Se retrouver">
        <span class="icon">🤝</span>
      </button>

      <button onclick="go('messages')" data-nav="messages" data-i18n-title="nav.messages" data-i18n-aria="nav.messages" title="Messages" aria-label="Messages">
        <span class="icon">💬</span>
      </button>

      <button onclick="go('profile')" data-nav="profile" data-i18n-title="nav.profile" data-i18n-aria="nav.profile" title="Profil" aria-label="Profil">
        <span class="icon">👤</span>
      </button>

      <button onclick="go('plans')" data-nav="plans" data-i18n-title="nav.plans" data-i18n-aria="nav.plans" title="Abonnement" aria-label="Abonnement">
        <span class="icon">💎</span>
        <span class="plan-badge" id="headerPlan">FREE</span>
      </button>

    </nav>

    <select class="lang-select" id="language" onchange="changeLanguage(this.value)" title="Langue">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
    </select>

  </div>
</header>

<main>

<!-- PLACEHOLDER - WILL REPLACE WITH FULL CONTENT VIA BASH APPROACH IF NEEDED -->
</main>
</body>
</html>
