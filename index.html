<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPYGO — chargement…</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<script>
(function () {
  try {
    var th = localStorage.getItem('aupygo_theme');
    if (th !== 'dark' && th !== 'light')
      th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
})();

/* Callbacks Turnstile disponibles AVANT le chargement de l'API */
window.turnstileToken = null;
window.onTurnstileVerified = function (token) {
  window.turnstileToken = token;
  if (typeof turnstileToken !== 'undefined') turnstileToken = token;
};
window.onTurnstileExpired = function () {
  window.turnstileToken = null;
  if (typeof turnstileToken !== 'undefined') turnstileToken = null;
};

(async function () {
  var STABLE = 'a5b2c260809d54c4f5d6c268596062867de11ae9';
  var CDN = 'https://cdn.jsdelivr.net/gh/admin-aupygo/AUPYGO@' + STABLE + '/';
  var CACHE_V = 'fix-20261006-captcha';
  var SITEKEY = '0x4AAAAAAEl5_H-ALybBhria';
  var urls = [
    'https://cdn.jsdelivr.net/gh/admin-aupygo/AUPYGO@0effaead41c5a928d4739fffd37cface5b86c8e2/index.html',
    'https://raw.githack.com/admin-aupygo/AUPYGO/0effaead41c5a928d4739fffd37cface5b86c8e2/index.html',
    'https://raw.githubusercontent.com/admin-aupygo/AUPYGO/0effaead41c5a928d4739fffd37cface5b86c8e2/index.html'
  ];

  function loadScript(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(); };
      s.onerror = function () { console.warn('[AUPYGO] script fail', src); resolve(); };
      document.head.appendChild(s);
    });
  }

  var html = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (res.ok) { html = await res.text(); break; }
    } catch (e) { console.warn('source ' + (i + 1), e); }
  }
  if (!html) {
    document.body.innerHTML = '<p style="font-family:system-ui,sans-serif;padding:24px;color:#64748b">Impossible de charger AUPYGO. Réessaie dans 30 s.</p>';
    return;
  }

  html = html.replace(/\?v=[^"']*/g, '?v=' + CACHE_V);
  html = html.replace(/(href|src)=["'][^"']*styles\.css[^"']*["']/gi, 'href="' + CDN + 'styles.css?v=' + CACHE_V + '"');

  var doc = new DOMParser().parseFromString(html, 'text/html');

  Array.from(doc.documentElement.attributes).forEach(function (a) {
    if (a.name !== 'lang') document.documentElement.setAttribute(a.name, a.value);
  });

  Array.from(doc.head.children).forEach(function (el) {
    var tag = el.tagName.toLowerCase();
    if (tag === 'script') return;
    if (tag === 'title') { document.title = el.textContent || 'AUPYGO'; return; }
    if (tag === 'link' && (el.rel === 'icon' || el.rel === 'apple-touch-icon')) return;
    document.head.appendChild(el.cloneNode(true));
  });

  var bodyClone = doc.body.cloneNode(true);
  Array.from(bodyClone.querySelectorAll('script')).forEach(function (s) { s.remove(); });
  document.body.innerHTML = '';
  while (bodyClone.firstChild) document.body.appendChild(bodyClone.firstChild);

  /* Scripts app d'abord (définit aussi onTurnstile*), puis Turnstile, puis modules */
  var beforeTurnstile = [
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    CDN + 'config.js?v=' + CACHE_V,
    'i18n.js?v=' + CACHE_V,
    'i18n-extra.js?v=' + CACHE_V,
    CDN + 'app.js?v=' + CACHE_V
  ];
  for (var j = 0; j < beforeTurnstile.length; j++) await loadScript(beforeTurnstile[j]);

  /* Charger Turnstile après le DOM + callbacks */
  await loadScript('https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit');

  function mountTurnstile() {
    var el = document.getElementById('turnstileContainer');
    if (!el || !window.turnstile) return;
    try {
      /* Vider puis render explicite (évite double widget) */
      el.innerHTML = '';
      el.className = '';
      window.turnstile.render(el, {
        sitekey: SITEKEY,
        callback: function (token) {
          window.turnstileToken = token;
          if (typeof turnstileToken !== 'undefined') turnstileToken = token;
          if (typeof onTurnstileVerified === 'function') onTurnstileVerified(token);
        },
        'expired-callback': function () {
          window.turnstileToken = null;
          if (typeof turnstileToken !== 'undefined') turnstileToken = null;
          if (typeof onTurnstileExpired === 'function') onTurnstileExpired();
        }
      });
      console.log('[AUPYGO] Turnstile monté');
    } catch (e) {
      console.warn('[AUPYGO] Turnstile render', e);
    }
  }

  /* turnstile API peut arriver un peu après onload */
  var tries = 0;
  (function waitTs() {
    if (window.turnstile) mountTurnstile();
    else if (tries++ < 40) setTimeout(waitTs, 100);
    else console.warn('[AUPYGO] Turnstile API non chargée');
  })();

  var modules = [
    'js/theme-toggle.js?v=' + CACHE_V,
    'js/realtime-fix.js?v=' + CACHE_V,
    'js/agenda-week-nav.js?v=' + CACHE_V,
    'js/staff-hierarchy.js?v=' + CACHE_V,
    'js/admin.js?v=' + CACHE_V,
    'js/admin-setrole-fix.js?v=' + CACHE_V,
    'js/admin-create-staff.js?v=' + CACHE_V,
    'js/admin-delete-staff.js?v=' + CACHE_V,
    'js/staff-ui.js?v=' + CACHE_V,
    'js/staff-profile.js?v=' + CACHE_V,
    'js/staff-profile-layout-fix.js?v=' + CACHE_V,
    'js/staff-events.js?v=' + CACHE_V,
    'js/staff-messages.js?v=' + CACHE_V,
    'js/staff-groups-fix.js?v=' + CACHE_V,
    'js/staff-msg-badge-fix.js?v=' + CACHE_V,
    'js/staff-visibility.js?v=' + CACHE_V,
    'js/staff-restrictions.js?v=' + CACHE_V,
    'js/staff-msg-unlock.js?v=' + CACHE_V,
    'js/join-events-fix.js?v=' + CACHE_V,
    'js/events-publish-fix.js?v=' + CACHE_V,
    'js/priority-fixes.js?v=' + CACHE_V,
    'js/cdc-fixes.js?v=' + CACHE_V,
    'js/staff-event-notify.js?v=' + CACHE_V,
    'js/free-aupygo-join.js?v=' + CACHE_V,
    'js/staff-status.js?v=' + CACHE_V,
    'js/xss-profile-card-fix.js?v=' + CACHE_V,
    'map-markers.js?v=' + CACHE_V,
    'js/message-rules.js?v=' + CACHE_V
  ];
  for (var k = 0; k < modules.length; k++) await loadScript(modules[k]);
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;color:#64748b">Chargement AUPYGO…</p>
</body>
</html>
