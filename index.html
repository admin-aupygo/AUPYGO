<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPYGO — chargement…</title>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/admin-aupygo/AUPYGO@0effaead41c5a928d4739fffd37cface5b86c8e2/index.html',
    'https://raw.githack.com/admin-aupygo/AUPYGO/0effaead41c5a928d4739fffd37cface5b86c8e2/index.html',
    'https://raw.githubusercontent.com/admin-aupygo/AUPYGO/0effaead41c5a928d4739fffd37cface5b86c8e2/index.html'
  ];
  var html = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (res.ok) { html = await res.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">Impossible de restaurer index.html. Ouvre GitHub → historique → restaure le commit <code>0effaead</code>.</p>';
    return;
  }
  // Cache-bust global
  html = html.replace(/\?v=20260926fix3/g, '?v=20260926ui4');
  html = html.replace(/\?v=20260926ui1/g, '?v=20260926ui4');
  html = html.replace(/\?v=20260926ui2/g, '?v=20260926ui4');
  html = html.replace(/\?v=20260926ui3/g, '?v=20260926ui4');

  var scripts = [
    'js/realtime-fix.js',
    'js/agenda-week-nav.js',
    'js/staff-hierarchy.js',
    'js/admin.js',
    'js/staff-ui.js',
    'js/staff-profile.js',
    'js/staff-events.js',
    'js/staff-messages.js',
    'js/staff-visibility.js',
    'js/staff-restrictions.js',
    'js/staff-msg-unlock.js'
  ];

  scripts.concat(['js/staff-hierarchy.js', 'js/admin.js']).forEach(function (src) {
    var re = new RegExp('<script[^>]*src="' + src.replace(/\./g, '\\.') + '[^"]*"[^>]*><\\/script>\\s*', 'gi');
    html = html.replace(re, '');
  });

  var inject = '';
  scripts.forEach(function (src) {
    inject += '<script src="' + src + '?v=20260926ui4"><\/script>\n';
  });
  html = html.replace('</body>', inject + '</body>');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;color:#64748b">Chargement AUPYGO…</p>
</body>
</html>
