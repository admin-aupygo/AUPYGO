<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUPYGO</title>
</head>
<body>
<p id="boot" style="font-family:sans-serif;text-align:center;padding:40px">Chargement AUPYGO…</p>
<script>
(async function () {
  try {
    const n = 6;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('html/p' + i + '.txt?t=' + Date.now());
      if (!r.ok) throw new Error('Fichier html/p' + i + '.txt manquant (' + r.status + ')');
      parts.push(await r.text());
    }
    document.open();
    document.write(parts.join(''));
    document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML = 'Erreur: ' + e.message + '<br><br>Recharge la page ou contacte le support.';
  }
})();
</script>
</body>
</html>
